<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Base Corail</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background-color: #f5f5f5;
        }

        header {
            background-color: #003366;
            color: white;
            padding: 20px;
            text-align: center;
        }

        nav {
            background-color: #0055a5;
            padding: 10px;
            text-align: center;
        }

        nav a {
            color: white;
            margin: 0 15px;
            text-decoration: none;
            font-weight: bold;
        }

        .container {
            padding: 20px;
        }

        .card {
            background: white;
            padding: 15px;
            margin: 10px;
            border-radius: 10px;
            display: inline-block;
            width: 300px;
            vertical-align: top;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }

        .card img {
            width: 100%;
            border-radius: 8px;
        }

        footer {
            text-align: center;
            padding: 15px;
            background: #003366;
            color: white;
            margin-top: 20px;
        }
    </style>
</head>
<body>

<header>
    <h1>Base de données Corail</h1>
    <p>Répertoire des voitures Corail SNCF</p>
</header>

<nav>
    <a href="#">Accueil</a>
    <a href="#">Voitures</a>
</nav>

<div class="container">

    <h2>Liste des voitures</h2>

    <div class="card">
        <img src="IMG_6030.jpeg" alt="Voiture Corail">
        <h3>B11tu</h3>
        <p><strong>UIC :</strong> 50 87 21-70 XXX-X</p>
        <p><strong>Type :</strong> Voiture 2e classe</p>
        <p><strong>Places :</strong> 88</p>
    </div>

    <div class="card">
        <img src="IMG_6018.jpg" alt="Voiture Corail">
        <h3>A9u</h3>
        <p><strong>UIC :</strong> 50 87 19-70 600-X</p>
        <p><strong>Type :</strong> 1ère classe</p>
        <p><strong>Places :</strong> 54</p>
    </div>

</div>

<footer>
    <p>Projet Corail - 2027</p>
</footer>

</body>
</html>
